<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Frapper Kits</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,900&family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{overflow-x:hidden;}
body{font-family:'DM Sans',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;overflow-x:hidden;}
:root{--green:#00c853;--green-dark:#00a844;--black:#0a0a0a;--white:#ffffff;--muted:#888;}

/* HEADER */
header{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(10,10,10,0.93);backdrop-filter:blur(8px);border-bottom:1px solid #1a1a1a;padding:0.7rem 2rem 0;}
.header-inner{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.8rem;gap:1rem;flex-wrap:wrap;}
.hlogo{font-family:'Barlow Condensed',sans-serif;font-size:1.8rem;font-weight:900;font-style:italic;color:#fff;letter-spacing:1px;line-height:1;white-space:nowrap;}
.lang-group{display:flex;border:1px solid #333;border-radius:999px;overflow:hidden;}
.lang-opt{background:transparent;border:none;color:#888;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;padding:7px 12px;cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.lang-opt:hover{color:#fff;}
.lang-opt.active{background:#222;color:#fff;}
.lang-sep{width:1px;background:#333;align-self:stretch;}
.wa-btn{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:var(--black);font-weight:600;font-size:14px;padding:10px 20px;border-radius:999px;text-decoration:none;transition:background 0.2s;white-space:nowrap;}
.wa-btn:hover{background:var(--green-dark);}
.wa-btn svg{width:18px;height:18px;flex-shrink:0;}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-bottom:1rem;}
.filter-btn{padding:7px 16px;border-radius:999px;border:1px solid #333;background:transparent;color:#aaa;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all 0.15s;}
.filter-btn:hover{border-color:#555;color:#fff;}
.filter-btn.active{background:var(--green);border-color:var(--green);color:var(--black);font-weight:600;}
.search-wrap{margin-left:auto;position:relative;}
.search-wrap input{padding:8px 14px 8px 36px;border-radius:999px;border:1px solid #333;background:#111;color:#fff;font-size:13px;font-family:'DM Sans',sans-serif;width:200px;}
.search-wrap input::placeholder{color:#555;}
.search-wrap input:focus{outline:none;border-color:var(--green);}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#555;pointer-events:none;}

/* HERO */
.hero{position:relative;width:100%;height:100vh;height:100dvh;min-height:560px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.hero-bg{position:absolute;inset:0;z-index:0;}
.hero-slide{position:absolute;inset:0;background-size:cover;background-position:center 20%;opacity:0;transition:opacity 2s ease-in-out;filter:brightness(0.35) grayscale(1);animation:kbzoom 16s ease-in-out infinite alternate;}
.hero-slide.active{opacity:1;}
@keyframes kbzoom{from{transform:scale(1);}to{transform:scale(1.06);}}
.hero-grad{position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(10,10,10,0.1) 0%,rgba(10,10,10,0.4) 60%,rgba(10,10,10,1) 100%);}
.hero-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:1.2rem;text-align:center;padding:0 1rem;}
.hero-sub{font-family:'DM Sans',sans-serif;font-size:13px;color:#888;letter-spacing:3px;text-transform:uppercase;}
.hero-cta{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#000;font-weight:700;font-size:14px;padding:13px 32px;border-radius:999px;border:none;cursor:pointer;letter-spacing:1px;font-family:'DM Sans',sans-serif;transition:background 0.2s,transform 0.15s;}
.hero-cta:hover{background:var(--green-dark);transform:scale(1.03);}
.hero-arrow{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);z-index:2;color:#444;animation:arrbounce 2s ease-in-out infinite;}
@keyframes arrbounce{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(8px);}}

/* CATALOG */
#catalog{position:relative;background:#0a0a0a;}
.cat-glow{position:absolute;inset:-50px;pointer-events:none;z-index:0;background:radial-gradient(ellipse 55% 40% at 15% 35%,rgba(0,200,83,0.06) 0%,transparent 70%),radial-gradient(ellipse 50% 45% at 85% 65%,rgba(0,200,83,0.05) 0%,transparent 70%);animation:glowmove 12s ease-in-out infinite alternate;}
@keyframes glowmove{0%{transform:translate(0,0) scale(1);}50%{transform:translate(25px,-15px) scale(1.04);}100%{transform:translate(-15px,20px) scale(0.97);}}
#catalog .count,#catalog .grid{position:relative;z-index:1;}
main{padding:2rem;}
.count{font-size:13px;color:var(--muted);margin-bottom:1.2rem;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;}
.card{background:#111;border:1px solid #222;border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color 0.15s,transform 0.15s;}
.card:hover{border-color:var(--green);transform:translateY(-3px);}
.card-img-wrap{width:100%;height:190px;overflow:hidden;background:#1a1a1a;}
.card-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.3s;}
.card:hover .card-img-wrap img{transform:scale(1.06);}
.card-placeholder{width:100%;height:100%;display:none;align-items:center;justify-content:center;color:#333;font-size:2rem;}
.card-body{padding:10px 12px 12px;}
.card-title{font-size:13px;font-weight:500;color:#eee;line-height:1.3;margin-bottom:4px;}
.card-cat{font-size:11px;color:var(--muted);}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;margin-top:6px;font-weight:600;}
.badge-home{background:#0a2e1a;color:#00c853;}
.badge-away{background:#0a1a2e;color:#4da6ff;}
.badge-third{background:#2e1f0a;color:#ffb347;}
.badge-other{background:#1e1e1e;color:#aaa;}
.lightbox{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.92);align-items:center;justify-content:center;padding:1rem;}
.lightbox.open{display:flex;}
.lightbox-inner{background:#111;border:1px solid #222;border-radius:16px;max-width:480px;width:100%;overflow:hidden;position:relative;}
.lightbox-img{width:100%;max-height:440px;object-fit:contain;background:#1a1a1a;display:block;}
.lightbox-body{padding:1.2rem;}
.lightbox-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:1px;margin-bottom:4px;}
.lightbox-cat{font-size:13px;color:var(--muted);margin-bottom:1rem;}
.lightbox-wa{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:var(--black);font-weight:600;font-size:14px;padding:11px 22px;border-radius:999px;text-decoration:none;transition:background 0.2s;width:100%;justify-content:center;}
.lightbox-wa:hover{background:var(--green-dark);}
.lightbox-close{position:absolute;top:12px;right:12px;background:rgba(0,0,0,0.6);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;}
.lightbox-close:hover{background:rgba(255,255,255,0.15);}
.empty{text-align:center;padding:4rem;color:var(--muted);font-size:15px;}
footer{text-align:center;padding:1.5rem 2rem;color:#444;font-size:12px;border-top:1px solid #1a1a1a;line-height:1.8;}
footer .founders{color:#666;font-size:13px;margin-bottom:4px;}
footer .founders span{color:var(--green);font-weight:600;}
@media(max-width:600px){header{padding:0.6rem 1rem 0;}.hlogo{font-size:1.3rem;}main{padding:1.2rem 1rem;}.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}.search-wrap input{width:120px;}.wa-btn span{display:none;}.wa-btn{padding:10px;}}
</style>
</head>

function closeLightbox(e){
  if(e&&e.target!==document.getElementById('lightbox')&&e.currentTarget?.tagName!=='BUTTON')return;
  document.getElementById('lightbox').classList.remove('open');

}

// Smooth scroll
function smoothScroll(){
  const target=document.getElementById('catalog');
  if(!target) return;
  const start=window.scrollY;
  const end=target.getBoundingClientRect().top+window.scrollY;
  const dur=950; const t0=performance.now();
  const ease=t=>t<0.5?2*t*t:-1+(4-2*t)*t;
  document.body.style.overflow='hidden';
  (function step(now){
    const p=Math.min((now-t0)/dur,1);
    window.scrollTo(0,start+(end-start)*ease(p));
    if(p<1){requestAnimationFrame(step);}
    else{document.body.style.overflow='';}
  })(t0);
}

  const tf=document.getElementById('table-fans');

  if(bp){bp.style.background=type==='player'?'#00c853':'transparent';bp.style.color=type==='player'?'#000':'#aaa';bp.style.borderColor=type==='player'?'#00c853':'#333';}
}
