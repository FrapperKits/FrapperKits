<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --green:#00c853;--green-dark:#00a844;--black:#0a0a0a;
  --white:#ffffff;--gray:#f4f4f2;--text:#1a1a1a;--muted:#888;
}
body{font-family:'DM Sans',sans-serif;background:var(--black);color:var(--white);min-height:100vh;}
header{background:var(--black);padding:2rem 2rem 0;position:sticky;top:0;z-index:100;border-bottom:1px solid #222;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;gap:1rem;flex-wrap:wrap;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;letter-spacing:2px;color:var(--white);}
.logo span{color:var(--green);}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.lang-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:transparent;border:1px solid #444;color:#aaa;
  font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;
  padding:8px 14px;border-radius:999px;cursor:pointer;transition:all 0.15s;
}
.lang-btn:hover{border-color:#777;color:#fff;}
.lang-btn .flag{font-size:16px;}
.wa-btn{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--green);color:var(--black);
  font-weight:600;font-size:14px;
  padding:10px 20px;border-radius:999px;
  text-decoration:none;transition:background 0.2s,transform 0.1s;white-space:nowrap;
}
.wa-btn:hover{background:var(--green-dark);transform:scale(1.03);}
.wa-btn svg{width:18px;height:18px;flex-shrink:0;}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-bottom:1.2rem;}
.filter-btn{
  padding:7px 16px;border-radius:999px;border:1px solid #333;
  background:transparent;color:#aaa;font-size:13px;font-family:'DM Sans',sans-serif;
  cursor:pointer;transition:all 0.15s;
}
.filter-btn:hover{border-color:#555;color:#fff;}
.filter-btn.active{background:var(--green);border-color:var(--green);color:var(--black);font-weight:600;}
.search-wrap{margin-left:auto;position:relative;}
.search-wrap input{
  padding:8px 14px 8px 36px;border-radius:999px;
  border:1px solid #333;background:#111;
  color:#fff;font-size:13px;font-family:'DM Sans',sans-serif;width:200px;
}
.search-wrap input::placeholder{color:#555;}
.search-wrap input:focus{outline:none;border-color:var(--green);}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#555;pointer-events:none;}
main{padding:2rem;}
.count{font-size:13px;color:var(--muted);margin-bottom:1.2rem;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;}
.card{
  background:#111;border:1px solid #222;border-radius:12px;
  overflow:hidden;cursor:pointer;transition:border-color 0.15s,transform 0.15s;
}
.card:hover{border-color:var(--green);transform:translateY(-3px);}
.card-img-wrap{width:100%;height:190px;overflow:hidden;background:#1a1a1a;position:relative;}
.card-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.3s;}
.card:hover .card-img-wrap img{transform:scale(1.06);}
.card-placeholder{width:100%;height:100%;display:none;align-items:center;justify-content:center;color:#333;font-size:2rem;}
.card-body{padding:10px 12px 12px;}
.card-title{font-size:13px;font-weight:500;color:#eee;line-height:1.3;margin-bottom:4px;}
.card-cat{font-size:11px;color:var(--muted);}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;margin-top:6px;font-weight:600;letter-spacing:0.3px;}
.badge-home{background:#0a2e1a;color:#00c853;}
.badge-away{background:#0a1a2e;color:#4da6ff;}
.badge-third{background:#2e1f0a;color:#ffb347;}
.badge-other{background:#1e1e1e;color:#aaa;}
.lightbox{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.92);align-items:center;justify-content:center;padding:1rem;}
.lightbox.open{display:flex;}
.lightbox-inner{
  background:#111;border:1px solid #222;border-radius:16px;
  max-width:480px;width:100%;overflow:hidden;position:relative;
  animation:popIn 0.2s ease;
}
@keyframes popIn{from{transform:scale(0.92);opacity:0;}to{transform:scale(1);opacity:1;}}
.lightbox-img{width:100%;max-height:440px;object-fit:contain;background:#1a1a1a;display:block;}
.lightbox-body{padding:1.2rem;}
.lightbox-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:1px;margin-bottom:4px;}
.lightbox-cat{font-size:13px;color:var(--muted);margin-bottom:1rem;}
.lightbox-wa{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--green);color:var(--black);font-weight:600;font-size:14px;
  padding:11px 22px;border-radius:999px;text-decoration:none;
  transition:background 0.2s;width:100%;justify-content:center;
}
.lightbox-wa:hover{background:var(--green-dark);}
.lightbox-close{
  position:absolute;top:12px;right:12px;
  background:rgba(0,0,0,0.6);border:none;color:#fff;
  width:32px;height:32px;border-radius:50%;cursor:pointer;
  font-size:18px;display:flex;align-items:center;justify-content:center;transition:background 0.15s;
}
.lightbox-close:hover{background:rgba(255,255,255,0.15);}
.empty{text-align:center;padding:4rem;color:var(--muted);font-size:15px;}
footer{text-align:center;padding:2rem;color:#333;font-size:12px;border-top:1px solid #1a1a1a;}
@media(max-width:600px){
  header{padding:1.2rem 1rem 0;}
  .logo{font-size:1.6rem;}
  main{padding:1.2rem 1rem;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
  .search-wrap input{width:130px;}
  .header-right{gap:6px;}
}
</style>

function getName(s){return s[lang];}
function getCatLabel(cat){return T[lang].catLabels[cat]||cat;}

function getBadgeClass(name){
  const n=name.toLowerCase();
  if(n.includes('3era')||n.includes('3rd')) return 'badge-third';
  if(n.includes('visitante')||n.includes('away')) return 'badge-away';
  if(n.includes('local')||n.includes('home')||n.includes('manga')||n.includes('sleeve')) return 'badge-home';
  return 'badge-other';
}
function getBadgeText(name){
  const n=name.toLowerCase();
  if(n.includes('3era')||n.includes('3rd')) return T[lang].badges.third;
  if(n.includes('visitante')||n.includes('away')) return T[lang].badges.away;
  if(n.includes('local')||n.includes('home')||n.includes('manga')||n.includes('sleeve')) return T[lang].badges.home;
  return T[lang].badges.other;
}

function getFiltered(){
  return allShirts.filter(s=>{
    const matchCat=currentCat==='all'||s.cat===currentCat;
    const matchSearch=getName(s).toLowerCase().includes(currentSearch.toLowerCase());
    return matchCat&&matchSearch;
  });
}

function renderGrid(items){
  const grid=document.getElementById('grid');
  const t=T[lang];
  document.getElementById('count').textContent=items.length+' '+t.countSuffix;
  if(!items.length){grid.innerHTML='<div class="empty">'+(lang==='es'?'No se encontraron camisetas':'No jerseys found')+'</div>';return;}
  grid.innerHTML=items.map(s=>{
    const name=getName(s);
    return `<div class="card" onclick="openLightbox('${s.id}','${name.replace(/'/g,"\\'")}','${getCatLabel(s.cat)}')">
      <div class="card-img-wrap">
        <img src="${DRIVE_IMG(s.id)}" alt="${name}" loading="lazy"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"/>
        <div class="card-placeholder">⚽</div>
      </div>
      <div class="card-body">
        <div class="card-title">${name}</div>
        <div class="card-cat">${getCatLabel(s.cat)}</div>
        <span class="badge ${getBadgeClass(name)}">${getBadgeText(name)}</span>
      </div>
    </div>`;
  }).join('');
}

function filter(cat,btn){
  currentCat=cat;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid(getFiltered());
}

function doSearch(val){currentSearch=val;renderGrid(getFiltered());}

function openLightbox(id,name,catLabel){
  document.getElementById('lb-img').src=DRIVE_IMG(id);
  document.getElementById('lb-title').textContent=name;
  document.getElementById('lb-cat').textContent=catLabel;
  document.getElementById('lb-wa-text').textContent=T[lang].waItem;
  const msg=encodeURIComponent(T[lang].waItemMsg+name+' 👕');
  document.getElementById('lb-wa').href='https://wa.me/'+WA+'?text='+msg;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeLightbox(e){
  if(!e||e.target===document.getElementById('lightbox')||e.currentTarget.tagName==='BUTTON'){
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow='';
  }
}

function toggleLang(){
  lang=lang==='es'?'en':'es';
  const t=T[lang];
  document.getElementById('langLabel').textContent=t.langLabel;
  document.querySelector('.lang-btn .flag').textContent=t.flag;
  document.querySelectorAll('.filter-btn').forEach(btn=>{
    const key=btn.getAttribute('onclick').match(/'([^']+)'/)?.[1];
    if(key&&t.cats[key]) btn.textContent=t.cats[key];
    if(btn.classList.contains('active')) btn.textContent=t.cats[key]||btn.textContent;
  });
  document.getElementById('searchInput').placeholder=t.search;
  document.querySelector('.wa-btn span[data-es]').textContent=t.waHeader;
  const waHeaderMsg=encodeURIComponent(t.waHeaderMsg);
  document.getElementById('waHeaderBtn').href='https://wa.me/'+WA+'?text='+waHeaderMsg;
  document.getElementById('footer').textContent=t.footer;
  document.querySelector('.logo').innerHTML='Camisas<span style="color:var(--green)">⚽</span>'+(lang==='en'?'Football':'Fútbol');
  renderGrid(getFiltered());
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox({target:document.getElementById('lightbox')});});
renderGrid(allShirts);
</script>
